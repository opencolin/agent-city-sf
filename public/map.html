<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build Week Map</title>
<meta name="description" content="A hand-painted map of San Francisco with the venues, hackathons and sponsors of Build Week.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@500;600;700;800&display=swap">
<style>
/* One deliberate light, game-like look over the painted city. */
:root {
  --sea: #3a9be0;
  --paper: #fffdf6;
  --ink: #141414;
  --mute: #5d6170;
  --gold: #ffd23f;
  --blue: #2457ff;
  --red: #e8433a;
  --green: #2f9e57;
  --px: "Press Start 2P", "Courier New", monospace;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--sea); color: var(--ink); font-family: var(--sans); font-size: 14px; overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

#stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab; }
#stage.dragging { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
#world img { display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }

/* Pins live in image coordinates but counter-scale so they stay readable at any zoom. */
.pin { position: absolute; transform: translate(-50%, -100%) scale(var(--inv, 1)); transform-origin: 50% 100%; display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; padding: 0; }
.pin .flag { background: var(--paper); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 5px 8px; font-weight: 800; font-size: 13px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.pin .flag .e { font-size: 16px; line-height: 1; }
.pin .flag .n { font-family: var(--px); font-size: 8px; background: var(--red); color: #fff; padding: 3px 4px; }
.pin .stem { width: 4px; height: 16px; background: var(--ink); }
.pin .dot { width: 12px; height: 6px; border-radius: 50%; background: #0006; margin-top: -2px; }
.pin:hover .flag, .pin[aria-expanded="true"] .flag { background: var(--gold); }
.pin.landmark .flag { background: #ffffffd9; border-width: 2px; box-shadow: 2px 2px 0 var(--ink); font-size: 11px; padding: 3px 6px; font-weight: 700; }
.pin.landmark .stem { height: 8px; width: 3px; }
.pin.sponsor { transform: translate(-50%, -100%) scale(var(--inv, 1)); }
.pin.sponsor .board { background: var(--blue); color: #fff; border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); padding: 6px 10px; text-align: center; animation: bob 3.6s ease-in-out infinite; }
.pin.sponsor .board small { display: block; font-family: var(--px); font-size: 7px; letter-spacing: 1px; opacity: .85; margin-bottom: 4px; }
.pin.sponsor .board b { font-size: 15px; font-weight: 800; white-space: nowrap; }
.pin.sponsor .rope { width: 2px; height: 30px; background: var(--ink); }
@keyframes bob { 50% { transform: translateY(-6px); } }
body.hide-venue .pin.venue, body.hide-sponsor .pin.sponsor, body.hide-landmark .pin.landmark { display: none; }

/* Panels */
.panel { background: var(--paper); border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); }
.bar { background: var(--ink); color: var(--paper); font-family: var(--px); font-size: 10px; letter-spacing: 1px; padding: 9px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.bar button { background: none; border: 0; color: inherit; font-family: var(--px); font-size: 10px; }
.btn { font-family: var(--px); font-size: 9px; letter-spacing: 1px; padding: 10px 12px; background: var(--gold); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); text-decoration: none; color: var(--ink); display: inline-block; }
.btn.blue { background: var(--blue); color: #fff; }
.btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
.btn[aria-pressed="false"] { background: var(--paper); }

#hud { position: fixed; z-index: 5; top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px; display: flex; gap: 12px; align-items: flex-start; pointer-events: none; }
#hud > * { pointer-events: auto; }
#title { width: 330px; max-height: calc(100vh - 110px); display: flex; flex-direction: column; }
#title .body { padding: 10px 12px; overflow: auto; }
#title h1 { font-family: var(--px); font-size: 13px; line-height: 1.5; margin: 0 0 6px; }
#title p { margin: 0 0 8px; color: var(--mute); line-height: 1.4; }
.day { margin-top: 10px; }
.day h3 { font-family: var(--px); font-size: 8px; letter-spacing: 1px; margin: 0 0 4px; padding: 4px 0; border-bottom: 2px solid var(--ink); }
.ev { display: grid; grid-template-columns: 58px 1fr; gap: 6px; padding: 6px 0; border-bottom: 2px solid #eee; text-decoration: none; color: inherit; font-size: 13px; line-height: 1.3; }
.ev:hover { background: #fff5b8; }
.ev time { color: var(--mute); font-weight: 600; font-size: 12px; }
.ev b { font-weight: 700; }
.ev .tag { display: inline-block; font-family: var(--px); font-size: 6px; padding: 2px 3px; margin-left: 4px; vertical-align: 2px; background: var(--red); color: #fff; }
.ev .tag.demo { background: var(--blue); }
.ev .tag.talk { background: var(--mute); }
#tools { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }

#zoom { position: fixed; z-index: 4; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 8px; }
#zoom .btn { width: 44px; height: 44px; padding: 0; font-size: 14px; }

#card { position: fixed; z-index: 6; width: 320px; max-width: calc(100vw - 32px); right: 76px; bottom: 16px; }
#card .body { padding: 12px; }
#card h2 { margin: 0 0 4px; font-size: 20px; font-weight: 800; }
#card .where { color: var(--mute); margin: 0 0 8px; font-weight: 600; }
#card p { margin: 0 0 10px; line-height: 1.45; }
#card .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
#card .tags span { font-size: 11px; font-weight: 700; border: 2px solid var(--ink); padding: 2px 6px; }
#card .evs { border-top: 2px solid #eee; padding-top: 6px; }

#hint { position: fixed; z-index: 3; left: 50%; bottom: 18px; transform: translateX(-50%); font-family: var(--px); font-size: 8px; letter-spacing: 1px; color: #fff; text-shadow: 2px 2px 0 #0008; pointer-events: none; transition: opacity 1s; }

@media (max-width: 720px) {
  #hud { flex-direction: column; }
  #title { width: 100%; max-height: 38vh; }
  #title.collapsed .body { display: none; }
  #tools { margin-left: 0; justify-content: flex-start; }
  #card { right: 16px; left: 16px; width: auto; bottom: 76px; }
  #hint { display: none; }
}
</style>
</head>
<body>
<div id="stage" aria-label="Painted map of San Francisco. Drag to pan, scroll or pinch to zoom.">
  <div id="world"><img id="art" src="sf-painted.webp" alt="Hand-painted isometric map of San Francisco"><div id="pins"></div></div>
</div>

<div id="hud">
  <section id="title" class="panel">
    <div class="bar"><span>BUILD WEEK · SF</span><button id="fold" aria-expanded="true" aria-label="Collapse panel">▾</button></div>
    <div class="body">
      <h1>THIS WEEK IN THE CITY</h1>
      <p>Venues, sponsors and every hackathon in San Francisco. Tap a pin to see what's on there.</p>
      <div id="week"></div>
    </div>
  </section>
  <div id="tools">
    <a class="btn" href="/">← THE PAPER</a>
    <button class="btn" data-layer="venue" aria-pressed="true">VENUES</button>
    <button class="btn" data-layer="sponsor" aria-pressed="true">SPONSORS</button>
    <button class="btn" data-layer="landmark" aria-pressed="true">LANDMARKS</button>
    <a class="btn blue" href="classic.html" title="The original pixel map with every AI company">CLASSIC MAP</a>
  </div>
</div>

<div id="zoom">
  <button class="btn" id="zin" aria-label="Zoom in">+</button>
  <button class="btn" id="zout" aria-label="Zoom out">−</button>
</div>

<aside id="card" class="panel" hidden aria-live="polite">
  <div class="bar"><span id="ckind">VENUE</span><button id="cclose" aria-label="Close">X</button></div>
  <div class="body" id="cbody"></div>
</aside>

<div id="hint">DRAG TO EXPLORE · SCROLL TO ZOOM</div>

<script>
// Positions are fractions of the painted image (x across, y down), set by eye against landmarks in the art.
const POIS = [
  // Builder venues
  { id: "aws", kind: "venue", name: "AWS Builder Loft", e: "🛠️", x: 0.690, y: 0.545, where: "SoMa", tags: ["Co-working", "Workshops", "Fast Wi-Fi"], note: "Free space for builders on AWS, with a steady run of workshops and hack nights.", match: /aws|builder loft/i },
  { id: "frontier", kind: "venue", name: "Frontier Tower", e: "🏢", x: 0.600, y: 0.585, where: "Mid-Market", tags: ["Co-working", "Community", "Events"], note: "A whole tower of builder floors, from AI to biotech to hardware.", match: /frontier tower/i },
  { id: "shack15", kind: "venue", name: "Shack15", e: "⛴️", x: 0.712, y: 0.615, where: "Ferry Building", tags: ["Members club", "Bay views", "Food"], note: "A founders' club over the water. Not always a hackathon, but sometimes.", match: /shack ?15/i },
  { id: "ef", kind: "venue", name: "Entrepreneurs First", e: "🚀", x: 0.655, y: 0.665, where: "San Francisco", tags: ["Talent investor", "Demo days"], note: "Where people come to find a co-founder before they have a company.", match: /entrepreneurs first|\bEF\b/ },
  { id: "esembassy", kind: "venue", name: "European Startup Embassy", e: "🇪🇺", x: 0.570, y: 0.505, where: "San Francisco", tags: ["Community", "Events"], note: "A landing pad for European founders arriving in the Bay.", match: /startup embassy/i },
  { id: "founders", kind: "venue", name: "Founders Inc.", e: "⚓", x: 0.480, y: 0.360, where: "Fort Mason", tags: ["Co-working", "Demo nights", "Bay views"], note: "Builder campus and showcase space on the northern waterfront.", match: /founders inc|fort mason/i },
  { id: "hf0", kind: "venue", name: "HF0", e: "🏠", x: 0.540, y: 0.660, where: "San Francisco", tags: ["Residency", "Live-in"], note: "A residency where founders live and build together for twelve weeks.", match: /\bhf0\b/i },
  // Landmarks
  { id: "ggb", kind: "landmark", name: "Golden Gate Bridge", e: "🌉", x: 0.530, y: 0.200 },
  { id: "salesforce", kind: "landmark", name: "Salesforce Tower", e: "🏙️", x: 0.661, y: 0.430 },
  { id: "coit", kind: "landmark", name: "Coit Tower", e: "🗼", x: 0.638, y: 0.325 },
  { id: "ggpark", kind: "landmark", name: "Golden Gate Park", e: "🌳", x: 0.325, y: 0.480 },
  { id: "alcatraz", kind: "landmark", name: "Alcatraz", e: "🏝️", x: 0.888, y: 0.320 },
  { id: "oracle", kind: "landmark", name: "Oracle Park", e: "⚾", x: 0.580, y: 0.740 },
  { id: "ferry", kind: "landmark", name: "Ferry Building", e: "🕰️", x: .712, y: .585 },
  { id: "transamerica", kind: "landmark", name: "Transamerica Pyramid", e: "🔺", x: .725, y: .430 },
  { id: "baybridge", kind: "landmark", name: "Bay Bridge", e: "🌁", x: .830, y: .560 },
  { id: "palace", kind: "landmark", name: "Palace of Fine Arts", e: "🏛️", x: .392, y: .300 },
  { id: "sutro", kind: "landmark", name: "Sutro Tower", e: "📡", x: .275, y: .180 },
  { id: "ladies", kind: "landmark", name: "Painted Ladies", e: "🏘️", x: .310, y: .570 },
  { id: "chinatown", kind: "landmark", name: "Chinatown", e: "🏮", x: .520, y: .505 },
];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDay = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const kindOf = e => /hack|build (night|day)|buildathon|jam\b|map-a-thon/i.test(e.name) ? "hack" : /demo|pitch|shark|\bvc|fund|founder|investor/i.test(e.name) ? "demo" : e.kind === "hackathon" ? "hack" : e.kind === "demo" ? "demo" : "talk";
const KTAG = { hack: "HACK", demo: "DEMO", talk: "TALK" };

// ── Pan & zoom ──
const stage = $("#stage"), world = $("#world"), art = $("#art"), pins = $("#pins");
let W = 0, H = 0, s = 1, tx = 0, ty = 0, minS = .2, maxS = 3;
function apply() {
  world.style.transform = `translate(${tx}px, ${ty}px) scale(${s})`;
  world.style.setProperty("--inv", Math.min(1.6, 1 / s));
}
function clamp() {
  const vw = innerWidth, vh = innerHeight, w = W * s, h = H * s;
  tx = w <= vw ? (vw - w) / 2 : Math.min(0, Math.max(vw - w, tx));
  ty = h <= vh ? (vh - h) / 2 : Math.min(0, Math.max(vh - h, ty));
}
function zoomAt(f, cx, cy) {
  const ns = Math.min(maxS, Math.max(minS, s * f));
  tx = cx - (cx - tx) * (ns / s); ty = cy - (cy - ty) * (ns / s); s = ns; clamp(); apply();
}
function fit() {
  minS = Math.max(innerWidth / W, innerHeight / H);   // cover the screen, no sea gaps
  maxS = Math.max(minS * 4, 1.5);
  s = Math.max(minS, Math.min(1, minS * 1.6));
  tx = innerWidth / 2 - W * .55 * s; ty = innerHeight / 2 - H * .42 * s; clamp(); apply();
}
const pts = new Map(); let last = null, moved = 0;
stage.addEventListener("pointerdown", e => { stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, e); moved = 0; stage.classList.add("dragging"); });
stage.addEventListener("pointermove", e => {
  if (!pts.has(e.pointerId)) return;
  const prev = pts.get(e.pointerId); pts.set(e.pointerId, e);
  if (pts.size === 1) { tx += e.clientX - prev.clientX; ty += e.clientY - prev.clientY; moved += Math.abs(e.clientX - prev.clientX) + Math.abs(e.clientY - prev.clientY); clamp(); apply(); }
  else if (pts.size === 2) {
    const [a, b] = [...pts.values()], d = Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
    if (last) zoomAt(d / last, (a.clientX + b.clientX) / 2, (a.clientY + b.clientY) / 2);
    last = d; moved = 99;
  }
});
const up = e => { pts.delete(e.pointerId); if (pts.size < 2) last = null; if (!pts.size) stage.classList.remove("dragging"); };
stage.addEventListener("pointerup", up); stage.addEventListener("pointercancel", up);
stage.addEventListener("wheel", e => { e.preventDefault(); zoomAt(Math.exp(-e.deltaY * (e.ctrlKey ? .01 : .0015)), e.clientX, e.clientY); hideHint(); }, { passive: false });
$("#zin").onclick = () => zoomAt(1.4, innerWidth / 2, innerHeight / 2);
$("#zout").onclick = () => zoomAt(1 / 1.4, innerWidth / 2, innerHeight / 2);
addEventListener("resize", () => { if (W) { minS = Math.max(innerWidth / W, innerHeight / H); s = Math.max(s, minS); clamp(); apply(); } });
let hinted = false; const hideHint = () => { if (!hinted) { hinted = true; $("#hint").style.opacity = 0; } };
stage.addEventListener("pointerdown", hideHint);

// ── Pins & cards ──
let EVENTS = [];
function eventsAt(p) { return p.match ? EVENTS.filter(e => p.match.test(e.name + " " + (e.hosts || []).join(" ") + " " + e.source)) : []; }
function evHtml(e) { return `<a class="ev" href="${esc(e.link)}" target="_blank" rel="noopener"><time>${esc(e.time || "")}</time><span><b>${esc(e.name)}</b><span class="tag ${e.k}">${KTAG[e.k]}</span></span></a>`; }
function renderPins(sponsors) {
  const all = [...POIS, ...sponsors];
  pins.innerHTML = all.map(p => {
    const left = (p.x * 100).toFixed(2) + "%", top = (p.y * 100).toFixed(2) + "%";
    if (p.kind === "sponsor") return `<button class="pin sponsor" data-id="${p.id}" style="left:${left};top:${top}" aria-label="Sponsor ${esc(p.name)}"><div class="board"><small>SPONSOR</small><b>${esc(p.name)}</b></div><div class="rope"></div></button>`;
    const n = eventsAt(p).length;
    return `<button class="pin ${p.kind}" data-id="${p.id}" style="left:${left};top:${top}" aria-expanded="false"><span class="flag"><span class="e">${p.e}</span>${esc(p.name)}${n ? `<span class="n">${n}</span>` : ""}</span><span class="stem"></span><span class="dot"></span></button>`;
  }).join("");
  pins.style.cssText = `position:absolute;inset:0;width:${W}px;height:${H}px`;
  pins.querySelectorAll(".pin").forEach(b => {
    b.addEventListener("pointerdown", e => e.stopPropagation());
    b.addEventListener("click", () => openCard(all.find(p => p.id === b.dataset.id), b));
  });
}
function openCard(p, btn) {
  pins.querySelectorAll('.pin[aria-expanded="true"]').forEach(x => x.setAttribute("aria-expanded", "false"));
  btn?.setAttribute("aria-expanded", "true");
  $("#ckind").textContent = p.kind.toUpperCase();
  const evs = p.kind === "sponsor" ? p.events : eventsAt(p);
  $("#cbody").innerHTML = `<h2>${p.e ? p.e + " " : ""}${esc(p.name)}</h2>
    ${p.where ? `<p class="where">${esc(p.where)}</p>` : ""}
    ${p.note ? `<p>${esc(p.note)}</p>` : ""}
    ${p.tags ? `<div class="tags">${p.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>` : ""}
    ${p.kind === "sponsor" ? `<p>Hosting or sponsoring ${evs.length} event${evs.length > 1 ? "s" : ""} on the calendar.</p>` : ""}
    ${evs?.length ? `<div class="evs">${evs.slice(0, 6).map(evHtml).join("")}</div>` : p.kind === "venue" ? `<p style="color:var(--mute)">Nothing on the calendar here yet.</p>` : ""}`;
  $("#card").hidden = false;
}
$("#cclose").onclick = () => { $("#card").hidden = true; pins.querySelectorAll(".pin").forEach(x => x.setAttribute("aria-expanded", "false")); };

// Sponsor billboards float over open water and parks: the most active hosts on the calendar.
const SPONSOR_SPOTS = [[.800, .170], [.905, .760], [.200, .870], [.775, .905], [.080, .140]];
function sponsorsFrom(events) {
  const skip = /^(personal|bond ai.*|hacklist.*|.*community|.*events? calendar|.*events)$/i;
  const c = {};
  events.forEach(e => new Set([...(e.hosts || []), e.source]).forEach(h => { if (h && !skip.test(h.trim())) (c[h] ||= []).push(e); }));
  return Object.entries(c).filter(([, es]) => es.length > 1).sort((a, b) => b[1].length - a[1].length).slice(0, SPONSOR_SPOTS.length)
    .map(([name, es], i) => ({ id: "sp" + i, kind: "sponsor", name, events: es, x: SPONSOR_SPOTS[i][0], y: SPONSOR_SPOTS[i][1] }));
}

// ── This week panel ──
function renderWeek() {
  const today = isoLocal(new Date()), end = isoLocal(new Date(Date.now() + 6 * 864e5));
  let up = EVENTS.filter(e => e.date >= today && e.date <= end);
  if (!up.length) up = EVENTS.slice(0, 30);
  const days = {}; up.forEach(e => (days[e.date] ||= []).push(e));
  $("#week").innerHTML = Object.entries(days).map(([d, es]) => `<div class="day"><h3>${d === today ? "TODAY" : parseDay(d).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }).toUpperCase()} · ${es.length}</h3>${es.map(evHtml).join("")}</div>`).join("");
}
$("#fold").onclick = () => { const t = $("#title"), c = t.classList.toggle("collapsed"); $("#fold").textContent = c ? "▸" : "▾"; $("#fold").setAttribute("aria-expanded", !c); t.querySelector(".body").hidden = c; };

document.querySelectorAll("[data-layer]").forEach(b => b.onclick = () => {
  const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on);
  document.body.classList.toggle("hide-" + b.dataset.layer, !on);
});

// ── Boot ──
const ready = new Promise(r => { if (art.complete && art.naturalWidth) r(); else art.onload = r; });
Promise.all([ready, fetch("events.json").then(r => r.json()).catch(() => [])]).then(([, rows]) => {
  W = art.naturalWidth; H = art.naturalHeight;
  world.style.width = W + "px"; world.style.height = H + "px";
  const mins = t => { const m = /(\d+):(\d+)\s*(AM|PM)/i.exec(t || ""); return m ? (+m[1] % 12 + (/pm/i.test(m[3]) ? 12 : 0)) * 60 + +m[2] : 0; };
  EVENTS = rows.map(e => ({ ...e, k: kindOf(e) })).sort((a, b) => a.date.localeCompare(b.date) || mins(a.time) - mins(b.time));
  fit(); renderPins(sponsorsFrom(EVENTS)); renderWeek();
});
</script>
</body>
</html>
