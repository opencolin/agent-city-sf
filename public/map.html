<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build Week Map</title>
<meta name="description" content="A real, north-up map of San Francisco and the Peninsula with the venues, hackathons and sponsors of Build Week.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Inter:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
/* One deliberate light, game-like look: a warm cartoon street map with painted sprites on top. */
:root {
  --sea: #4aa8e8;
  --paper: #fffdf6;
  --ink: #141414;
  --mute: #5d6170;
  --gold: #ffd23f;
  --blue: #2457ff;
  --red: #e8433a;
  --purple: #7b4bd6;
  --px: "Press Start 2P", "Courier New", monospace;
  --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--sea); color: var(--ink); font-family: var(--sans); font-size: 14px; overflow: hidden; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }
#map { position: fixed; inset: 0; }
.maplibregl-ctrl-attrib { font-size: 10px; }

/* Sprites and pins are MapLibre markers; --s is the zoom scale set on the map container. */
.sprite { pointer-events: auto; cursor: pointer; }
.sprite img { display: block; width: calc(var(--w) * var(--s, 1)); height: auto; filter: drop-shadow(0 6px 4px #0004); transition: transform .2s; user-select: none; -webkit-user-drag: none; }
.sprite:hover img { transform: translateY(-4px) scale(1.04); }
.pin { display: flex; flex-direction: column; align-items: center; background: none; border: 0; padding: 0; }
.pin .flag { background: var(--paper); border: 3px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); padding: 4px 8px; font-weight: 800; font-size: 13px; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.pin .flag .n { font-family: var(--px); font-size: 8px; background: var(--red); color: #fff; padding: 3px 4px; }
.pin .stem { width: 3px; height: 14px; background: var(--ink); }
/* Venue names sit above everything; event pins under them, then sprites. */
.maplibregl-marker.pin.venue { z-index: 6; }
.maplibregl-marker.pin.spot { z-index: 4; }
.maplibregl-marker.pin.city { z-index: 5; }
.maplibregl-marker.blimp { z-index: 7; }
.pin.tucked { visibility: hidden; }
.pin .flag { transition: transform .15s; }
.pin:hover .flag, .pin[aria-expanded="true"] .flag { background: var(--gold); }
.pin.city .flag { background: var(--gold); font-size: 15px; }
.pin.spot .flag { font-family: var(--px); font-size: 9px; padding: 3px 6px; gap: 4px; background: var(--red); color: #fff; border-width: 2px; box-shadow: 2px 2px 0 var(--ink); }
.pin.spot.area .flag { background: var(--purple); }
.pin.spot .stem { height: 10px; }
.pin.spot:hover .flag, .pin.spot[aria-expanded="true"] .flag { background: var(--gold); color: var(--ink); }
.blimp { pointer-events: auto; cursor: pointer; }
.blimp .body { position: relative; animation: bob 14s ease-in-out infinite; }  /* drift the inside: the marker's own transform positions it */
.blimp img { display: block; width: calc(170px * var(--s, 1)); filter: drop-shadow(0 10px 6px #0003); }
.blimp b { position: absolute; left: 22%; right: 30%; top: 26%; height: 30%; display: grid; place-items: center; text-align: center; font-weight: 800; font-size: calc(13px * var(--s, 1)); line-height: 1.05; color: var(--ink); overflow: hidden; }
@keyframes bob { 0%, 100% { transform: translate(0, 0); } 25% { transform: translate(6px, -3px); } 50% { transform: translate(10px, -5px); } 75% { transform: translate(4px, -2px); } }
@media (prefers-reduced-motion: reduce) { .blimp .body { animation: none; } }

/* Zoom bands and layer toggles */
body.far .mid-up, body:not(.far) .far-only, body:not(.close) .close-only { display: none !important; }
body.hide-venue .venue, body.hide-spot .spot, body.hide-landmark .landmark, body.hide-sponsor .sponsor { display: none !important; }

/* Panels */
.panel { background: var(--paper); border: 3px solid var(--ink); box-shadow: 5px 5px 0 var(--ink); }
.bar { background: var(--ink); color: var(--paper); font-family: var(--px); font-size: 10px; letter-spacing: 1px; padding: 9px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.bar button { background: none; border: 0; color: inherit; font-family: var(--px); font-size: 10px; }
.btn { font-family: var(--px); font-size: 9px; letter-spacing: 1px; padding: 10px 12px; background: var(--gold); border: 3px solid var(--ink); box-shadow: 4px 4px 0 var(--ink); text-decoration: none; color: var(--ink); display: inline-block; }
.btn.blue { background: var(--blue); color: #fff; }
.btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--ink); }
.btn[aria-pressed="false"] { background: var(--paper); }

#hud { position: fixed; z-index: 5; top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; right: 16px; display: flex; gap: 12px; align-items: flex-start; pointer-events: none; }
#hud > * { pointer-events: auto; }
#title { width: 330px; max-height: calc(100vh - 110px); display: flex; flex-direction: column; }
#title .body { padding: 10px 12px; overflow: auto; }
#title h1 { font-family: var(--px); font-size: 13px; line-height: 1.5; margin: 0 0 6px; }
#title p { margin: 0 0 8px; color: var(--mute); line-height: 1.4; }
.day { margin-top: 10px; }
.day h3 { font-family: var(--px); font-size: 8px; letter-spacing: 1px; margin: 0 0 4px; padding: 4px 0; border-bottom: 2px solid var(--ink); }
.ev { display: grid; grid-template-columns: 58px 1fr; gap: 6px; padding: 6px 0; border-bottom: 2px solid #eee; text-decoration: none; color: inherit; font-size: 13px; line-height: 1.3; }
.ev:hover { background: #fff5b8; }
.ev time { color: var(--mute); font-weight: 600; font-size: 12px; }
.ev b { font-weight: 700; }
.ev .tag { display: inline-block; font-family: var(--px); font-size: 6px; padding: 2px 3px; margin-left: 4px; vertical-align: 2px; background: var(--red); color: #fff; }
.ev .tag.demo { background: var(--blue); }
.ev .tag.talk { background: var(--mute); }
#tools { margin-left: auto; display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; max-width: 760px; }

#card { position: fixed; z-index: 6; width: 340px; max-width: calc(100vw - 32px); right: 16px; bottom: 40px; max-height: 70vh; display: flex; flex-direction: column; }
#card .body { padding: 12px; overflow: auto; }
#card .art { display: block; max-width: 120px; max-height: 120px; margin: 0 auto 8px; }
#card h2 { margin: 0 0 4px; font-size: 20px; font-weight: 800; }
#card .where { color: var(--mute); margin: 0 0 6px; font-weight: 600; }
#card p { margin: 0 0 10px; line-height: 1.45; }
#card .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 10px; }
#card .tags span { font-size: 11px; font-weight: 700; border: 2px solid var(--ink); padding: 2px 6px; }
#card .evs { border-top: 2px solid #eee; padding-top: 6px; }

@media (max-width: 720px) {
  #hud { flex-direction: column; }
  #title { width: 100%; max-height: 38vh; }
  #tools { margin-left: 0; justify-content: flex-start; }
  #tools .btn { padding: 8px 9px; font-size: 8px; }
  #card { left: 16px; right: 16px; width: auto; bottom: 30px; }
}
</style>
</head>
<body class="far">
<div id="map" aria-label="Map of San Francisco and the Peninsula. Drag to pan, scroll or pinch to zoom."></div>

<div id="hud">
  <section id="title" class="panel">
    <div class="bar"><span>BUILD WEEK · SF</span><button id="fold" aria-expanded="true" aria-label="Collapse panel">▾</button></div>
    <div class="body">
      <h1>THIS WEEK IN THE CITY</h1>
      <p>Venues, sponsors and every hackathon from San Francisco to San Jose. Zoom in for landmarks, then closer for venues and events; tap anything to see what's on.</p>
      <div id="week"></div>
    </div>
  </section>
  <div id="tools">
    <a class="btn" href="/">← THE PAPER</a>
    <button class="btn" data-fly="bay">BAY AREA</button>
    <button class="btn" data-fly="sf">SAN FRANCISCO</button>
    <button class="btn" id="tilt" aria-pressed="true">3D</button>
    <button class="btn" data-layer="venue" aria-pressed="true">VENUES</button>
    <button class="btn" data-layer="spot" aria-pressed="true">EVENTS</button>
    <button class="btn" data-layer="landmark" aria-pressed="true">LANDMARKS</button>
    <button class="btn" data-layer="sponsor" aria-pressed="true">SPONSORS</button>
  </div>
</div>

<aside id="card" class="panel" hidden aria-live="polite">
  <div class="bar"><span id="ckind">VENUE</span><button id="cclose" aria-label="Close">X</button></div>
  <div class="body" id="cbody"></div>
</aside>

<script>
// ── Data: everything is placed by real latitude/longitude ──
const LANDMARKS = [
  { id: "ggb", name: "Golden Gate Bridge", lat: 37.8199, lng: -122.4783, w: 120 },
  { id: "alcatraz", name: "Alcatraz", lat: 37.8267, lng: -122.4230, w: 130 },
  { id: "palace", name: "Palace of Fine Arts", lat: 37.8029, lng: -122.4484, w: 120 },
  { id: "coit", name: "Coit Tower", lat: 37.8024, lng: -122.4058, w: 80 },
  { id: "transamerica", name: "Transamerica Pyramid", lat: 37.7952, lng: -122.4028, w: 80 },
  { id: "salesforce", name: "Salesforce Tower", lat: 37.7897, lng: -122.3972, w: 90 },
  { id: "ferry", name: "Ferry Building", lat: 37.7955, lng: -122.3937, w: 120 },
  { id: "cablecar", name: "Cable car", lat: 37.7920, lng: -122.4087, w: 70 },
  { id: "oracle", name: "Oracle Park", lat: 37.7786, lng: -122.3893, w: 130 },
  { id: "ladies", name: "Painted Ladies", lat: 37.7762, lng: -122.4328, w: 120 },
  { id: "conservatory", name: "Conservatory of Flowers", lat: 37.7718, lng: -122.4600, w: 100 },
  { id: "sutro", name: "Sutro Tower", lat: 37.7552, lng: -122.4528, w: 90 },
  { id: "campanile", name: "Berkeley Campanile", lat: 37.8721, lng: -122.2578, w: 80 },
  { id: "hoover", name: "Stanford's Hoover Tower", lat: 37.4275, lng: -122.1697, w: 90 },
  { id: "hangar", name: "Hangar One, Moffett Field", lat: 37.4155, lng: -122.0496, w: 150 },
  { id: "ring", name: "Apple Park", lat: 37.3349, lng: -122.0090, w: 150 },
];

const VENUES = [
  { id: "aws", sprite: "v_aws", name: "AWS Builder Loft", lat: 37.7904, lng: -122.3993, address: "First Market Tower, 525 Market St", where: "Financial District", tags: ["Co-working", "Workshops", "Fast Wi-Fi"], note: "Free space for builders on AWS, with a steady run of workshops and hack nights.", match: /aws builder loft|525 market/i },
  { id: "frontier", sprite: "v_frontier", name: "Frontier Tower", lat: 37.7826, lng: -122.4098, address: "995 Market St", where: "Mid-Market", tags: ["Co-working", "Community", "Events"], note: "A whole tower of builder floors, from AI to biotech to hardware.", match: /frontier tower|995 market/i },
  { id: "shack15", name: "Shack15", lat: 37.7962, lng: -122.3941, address: "Ferry Building, Suite 201", where: "Embarcadero", tags: ["Members club", "Bay views", "Food"], note: "A founders' club over the water. Not always a hackathon, but sometimes.", match: /shack ?15/i },
  { id: "ef", sprite: "v_ef", name: "Entrepreneurs First", lat: 37.7870, lng: -122.3945, address: "501 Folsom St, floors 1 & 2", where: "SoMa", tags: ["Talent investor", "Demo days"], note: "Where people come to find a co-founder before they have a company.", match: /entrepreneurs first|501 folsom/i },
  { id: "esembassy", sprite: "v_esembassy", name: "European Startup Embassy", lat: 37.7819, lng: -122.3949, address: "461 Bryant St", where: "South Park", tags: ["Community", "Events"], note: "A landing pad for European founders arriving in the Bay.", match: /startup embassy|461 bryant/i },
  { id: "founders", sprite: "v_founders", name: "Founders Inc.", lat: 37.8066, lng: -122.4318, address: "Fort Mason Center", where: "Fort Mason", tags: ["Co-working", "Demo nights", "Bay views"], note: "Builder campus and showcase space on the northern waterfront.", match: /founders,? inc/i },
  { id: "hf0", sprite: "v_hf0", name: "HF0", lat: 37.7777, lng: -122.4336, address: "1000 Fulton St (the Archbishop's Mansion)", where: "Alamo Square", tags: ["Residency", "Live-in"], note: "A residency where founders live and build together for twelve weeks, in a historic mansion across from Alamo Square Park.", match: /\bhf0\b|1000 fulton/i },
  { id: "alamo", sprite: "v_alamo", name: "ACCELR8 Alamo Square", lat: 37.7772, lng: -122.4369, address: "1200 Fulton St, at Scott", where: "Alamo Square", tags: ["Co-living", "Sunday dinner & demos", "Short stays"], note: "A Victorian hacker home for founders and builders, a block from the park. Furnished rooms, month-to-month or short stays, and a weekly Sunday night dinner and demos.", url: "https://alamosquare.house", match: /alamo square house|1200 fulton/i },
  { id: "spc", sprite: "v_spc", name: "South Park Commons", lat: 37.7806, lng: -122.3940, address: "380 Brannan St", where: "South Beach", tags: ["Founder community", "Firesides", "Members"], note: "A community for technologists in the -1 to 0 stage, figuring out what to build next. Runs its own fund and a steady line of firesides and forums.", url: "https://lu.ma/southparkcommons-events", host: /south park commons/i, match: /south park commons|380 brannan|\bspc\b/i },
  { id: "accelr8", sprite: "v_accelr8", name: "ACCELR8 Hacker Hotel on Polk", lat: 37.7834, lng: -122.4190, address: "712 Polk St", where: "Tenderloin", tags: ["Hacker house", "Co-living", "Cowork club"], note: "A hacker house on Polk Street for founders and builders, with a cowork club on Floor 7 of Frontier Tower for non-residents.", url: "https://lu.ma/accelr8", host: /accelr8/i, match: /accelr8|712 polk/i },
  { id: "luxor", sprite: "v_luxor", name: "Luxor AI", lat: 37.7870, lng: -122.3982, address: "590 Howard St", where: "SoMa", tags: ["AI", "Agent cloud"], note: "Home of Luxor (luxor.tech) and Luxor Agent Cloud (tenki.cloud), formerly Tenki.", urls: ["https://luxor.tech", "https://tenki.cloud"], host: /luxor|tenki|agent cloud/i, match: /luxor|tenki|agent cloud|590 howard/i },
  { id: "klamath", name: "The Historic Klamath", lat: 37.8007, lng: -122.3984, address: "Pier 9", where: "Embarcadero", tags: ["Boat", "Hackathon"], note: "Boat Hackathon: code aboard a historic ferry on the Bay, Nov 16–20, 9am–5pm. ShowBoat Demo Day Nov 21, 1–5pm.", urls: ["https://boathackathon.com/", "https://luma.com/BoatHackathonDemos"], match: /klamath|boat hackathon|pier 9\b/i },
  { id: "accelr8market", sprite: "v_accelr8_market", name: "ACCELR8 Hacker Hotel on Market", lat: 37.7763, lng: -122.4182, address: "1412 Market St", where: "Civic Center", tags: ["Hacker house", "Co-living"], note: "ACCELR8's hacker hotel on Market Street, for founders and builders who want to live where they build.", url: "https://lu.ma/accelr8", match: /1412 market/i },
];

const CITIES = [
  { id: "c-sf", name: "San Francisco", lat: 37.7749, lng: -122.4194, loc: /san francisco/i, fly: "sf" },
  { id: "c-oak", name: "Oakland", lat: 37.8044, lng: -122.2712, loc: /oakland/i },
  { id: "c-berk", name: "Berkeley", lat: 37.8716, lng: -122.2727, loc: /berkeley/i },
  { id: "c-sm", name: "San Mateo & Redwood City", lat: 37.5300, lng: -122.2700, loc: /redwood city|san mateo|burlingame|san carlos|foster city/i },
  { id: "c-mp", name: "Menlo Park", lat: 37.4530, lng: -122.1817, loc: /menlo park/i },
  { id: "c-pa", name: "Palo Alto", lat: 37.4419, lng: -122.1430, loc: /palo alto|stanford/i },
  { id: "c-mv", name: "Mountain View", lat: 37.3861, lng: -122.0839, loc: /mountain view/i },
  { id: "c-sv", name: "Sunnyvale & Cupertino", lat: 37.3688, lng: -122.0363, loc: /sunnyvale|cupertino|santa clara/i },
  { id: "c-sj", name: "San Jose", lat: 37.3382, lng: -121.8863, loc: /san jose/i },
];

// Blimps float over open water; the most active hosts on the calendar ride on them.
const BLIMP_SPOTS = [[37.815, -122.37], [37.77, -122.52], [37.70, -122.30], [37.60, -122.21], [37.86, -122.43]];
const VIEWS = { bay: [[-122.62, 37.30], [-121.80, 37.92]], sf: [[-122.52, 37.705], [-122.355, 37.835]] };
// The painted overview (bay-painted.webp) lives on the front page; the map itself stays true to the street data.
const PAINTINGS = [];

// ── Helpers ──
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pad = n => String(n).padStart(2, "0");
const isoLocal = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseDay = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const mins = t => { const m = /(\d+):(\d+)\s*(AM|PM)/i.exec(t || ""); return m ? (+m[1] % 12 + (/pm/i.test(m[3]) ? 12 : 0)) * 60 + +m[2] : 0; };
const kindOf = e => /hack|build (night|day)|buildathon|jam\b|map-a-thon/i.test(e.name) ? "hack" : /demo|pitch|shark|\bvc|fund|founder|investor/i.test(e.name) ? "demo" : e.kind === "hackathon" ? "hack" : e.kind === "demo" ? "demo" : "talk";
const KTAG = { hack: "HACK", demo: "DEMO", talk: "TALK" };
const evHtml = (e, withDate) => `<a class="ev" href="${esc(e.link)}" target="_blank" rel="noopener"><time>${withDate ? esc(parseDay(e.date).toLocaleDateString("en-US", { month: "short", day: "numeric" })) + "<br>" : ""}${esc(e.time || "")}</time><span><b>${esc(e.name)}</b><span class="tag ${e.k}">${KTAG[e.k]}</span></span></a>`;
const venueText = e => [e.venue, e.address, e.name, e.source, ...(e.hosts || [])].join(" ");
let EVENTS = [];

// ── Map ──
const map = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/liberty",
  bounds: location.hash === "#bay" ? VIEWS.bay : VIEWS.sf, fitBoundsOptions: { padding: 30 },  // opens on San Francisco; #bay for the whole Bay
  pitch: 45, bearing: 0, maxPitch: 65, minZoom: 8, maxZoom: 18.5,
  attributionControl: { compact: true },
});
map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), "bottom-left");

// Warm cartoon palette over the Liberty style.
const PAINT = {
  background: { "background-color": "#f4ead2" },
  water: { "fill-color": "#4aa8e8" },
  park: { "fill-color": "#9ed67c", "fill-opacity": 0.9 },
  landcover_wood: { "fill-color": "#6dbb5a", "fill-opacity": 0.7 },
  landcover_grass: { "fill-color": "#b7e08f", "fill-opacity": 0.7 },
  landcover_sand: { "fill-color": "#f6dc9a" },
  landuse_residential: { "fill-color": "#f2e2c4", "fill-opacity": 0.7 },
  road_minor: { "line-color": "#ffffff" },
  road_secondary_tertiary: { "line-color": "#fff3c4" },
  road_trunk_primary: { "line-color": "#ffd77a" },
  road_motorway: { "line-color": "#ff9d5c" },
  "building-3d": {
    "fill-extrusion-color": ["interpolate", ["linear"], ["get", "render_height"], 0, "#f8c9a6", 12, "#f4a7a0", 30, "#d6b3ef", 80, "#9ccaf3", 200, "#7fb2ee"],
    "fill-extrusion-opacity": 0.95,
  },
  building: { "fill-color": "#f3c9a8" },
};
const HIDE = /^(poi_|road_one_way|highway-shield|road_shield|natural_earth)/;

map.on("style.load", () => {
  for (const l of map.getStyle().layers) {
    if (HIDE.test(l.id)) map.setLayoutProperty(l.id, "visibility", "none");
    for (const [k, v] of Object.entries(PAINT[l.id] || {})) { try { map.setPaintProperty(l.id, k, v); } catch (e) { /* layer lacks this property */ } }
  }
  // Painted overview on top of the street map, fading out as you zoom in.
  for (const p of PAINTINGS) {
    const [w, n, e, s] = p.bounds;
    map.addSource("paint-" + p.id, { type: "image", url: p.url, coordinates: [[w, n], [e, n], [e, s], [w, s]] });
    map.addLayer({ id: "paint-" + p.id, type: "raster", source: "paint-" + p.id,
      paint: { "raster-opacity": ["interpolate", ["linear"], ["zoom"], p.fade[0], 1, p.fade[1], 0], "raster-fade-duration": 0 } }, "label_other");
  }
});

// Zoom scale for sprites (shrink gently when zoomed out) and near/far bands.
function onZoom() {
  const z = map.getZoom();
  map.getContainer().style.setProperty("--s", Math.max(0.35, Math.min(1.7, 2 ** ((z - 14.5) * 0.55))).toFixed(3));
  // far: cities only · mid: sprites · close (zoom 13+): venue names and event pins too
  document.body.classList.toggle("far", z < 11.2);
  document.body.classList.toggle("close", z >= 13);
}
map.on("zoom", onZoom);

// ── Decluttering ──
// Venue names win: a venue label that hits another is nudged below its sprite, and an
// event pin that would cover a venue label (or a busier pin) is tucked away until you zoom in.
function declutter() {
  const pins = [...document.querySelectorAll(".pin.venue, .pin.spot")];
  pins.forEach(p => { p.classList.remove("tucked"); p.querySelector(".flag").style.transform = ""; });
  const vis = p => p.getClientRects().length && getComputedStyle(p).display !== "none";
  const hit = (a, b, pad = 3) => a.left < b.right + pad && b.left < a.right + pad && a.top < b.bottom + pad && b.top < a.bottom + pad;
  const placed = [];
  for (const p of pins.filter(p => p.classList.contains("venue") && vis(p))) {
    const f = p.querySelector(".flag"), r = f.getBoundingClientRect();
    const tries = [0, r.height + 8, -(r.height + 8), 2 * (r.height + 8)];
    let dy = 0;
    for (const t of tries) {
      const rr = { left: r.left, right: r.right, top: r.top + t, bottom: r.bottom + t };
      if (!placed.some(q => hit(q, rr))) { dy = t; break; }
    }
    if (dy) f.style.transform = `translateY(${dy}px)`;
    placed.push({ left: r.left, right: r.right, top: r.top + dy, bottom: r.bottom + dy });
  }
  const spots = pins.filter(p => p.classList.contains("spot") && vis(p)).sort((a, b) => (+b.dataset.n || 0) - (+a.dataset.n || 0));
  for (const p of spots) {
    const r = p.querySelector(".flag").getBoundingClientRect();
    if (placed.some(q => hit(q, r))) p.classList.add("tucked");
    else placed.push(r);
  }
}
let declutterTimer;
const declutterSoon = () => { clearTimeout(declutterTimer); declutterTimer = setTimeout(declutter, 60); };
map.on("moveend", declutterSoon);
map.on("zoomend", declutterSoon);
map.on("pitchend", declutterSoon);
addEventListener("resize", declutterSoon);

// ── Markers ──
function marker(el, lat, lng, anchor = "bottom") {
  return new maplibregl.Marker({ element: el, anchor, pitchAlignment: "viewport", rotationAlignment: "viewport" }).setLngLat([lng, lat]).addTo(map);
}
function spriteEl(src, w, cls, label) {
  const el = document.createElement("div");
  el.className = "sprite " + cls; el.style.setProperty("--w", w + "px"); el.title = label;
  el.innerHTML = `<img src="${src}" alt="${esc(label)}" loading="lazy">`;
  return el;
}
function pinEl(cls, html, label) {
  const el = document.createElement("button");
  el.className = "pin " + cls; el.setAttribute("aria-label", label); el.setAttribute("aria-expanded", "false");
  el.innerHTML = `<span class="flag">${html}</span><span class="stem"></span>`;
  return el;
}
function bindCard(el, data) { el.addEventListener("click", ev => { ev.stopPropagation(); openCard(data, el); }); }

function placeAll() {
  for (const l of LANDMARKS) bindCard(marker(spriteEl(`sprites/${l.id}.webp`, l.w, "landmark" + (l.lat > 37.70 && l.lng < -122.35 ? " mid-up" : ""), l.name), l.lat, l.lng).getElement(), { kind: "landmark", ...l });

  for (const v of VENUES) {
    const evs = EVENTS.filter(e => v.match.test(venueText(e)));
    const data = { kind: "venue", ...v, events: evs, art: v.sprite ? `sprites/${v.sprite}.webp` : null };
    if (v.sprite) bindCard(marker(spriteEl(`sprites/${v.sprite}.webp`, 90, "venue mid-up", v.name), v.lat, v.lng).getElement(), data);
    const pin = pinEl("venue close-only", `${esc(v.name)}${evs.length ? `<span class="n">${evs.length}</span>` : ""}`, v.name);
    if (v.sprite) pin.style.marginBottom = "calc(80px * var(--s, 1))";
    bindCard(marker(pin, v.lat, v.lng).getElement(), data);
  }

  // Events not at a curated venue: group by public venue, or by neighborhood when the address is for guests only.
  const groups = {};
  for (const e of EVENTS) {
    if (!e.lat || VENUES.some(v => v.match.test(venueText(e)))) continue;
    const pub = e.venue_visibility === "public" && e.venue;
    const key = pub ? "v:" + (e.place_id || e.venue) : "n:" + (e.neighborhood || e.city || e.location);
    (groups[key] ||= { pub, name: pub ? e.venue : (e.neighborhood || e.city || "Bay Area"), address: pub ? e.address : "", events: [] }).events.push(e);
  }
  for (const g of Object.values(groups)) {
    const lat = g.events.reduce((t, e) => t + e.lat, 0) / g.events.length, lng = g.events.reduce((t, e) => t + e.lng, 0) / g.events.length;
    const n = g.events.length;
    const pin = pinEl(`spot close-only${g.pub ? "" : " area"}`, `${g.pub ? "●" : "◆"} ${n}`, `${g.name}, ${n} event${n > 1 ? "s" : ""}`);
    pin.title = g.name; pin.dataset.n = n;
    bindCard(marker(pin, lat, lng).getElement(), { kind: "spot", ...g, where: g.pub ? (g.events[0].neighborhood || "") : "Exact address shared after you RSVP" });
  }

  for (const c of CITIES) {
    const evs = EVENTS.filter(e => c.loc.test(e.location || ""));
    const pin = pinEl("city far-only", `${esc(c.name)}${evs.length ? `<span class="n">${evs.length}</span>` : ""}`, c.name);
    bindCard(marker(pin, c.lat, c.lng).getElement(), { kind: "city", ...c, events: evs });
  }

  sponsorsFrom(EVENTS).forEach((sp, i) => {
    const el = document.createElement("div");
    el.className = "blimp sponsor";
    el.innerHTML = `<div class="body" style="animation-delay:-${i * 5}s"><img src="sprites/blimp.webp" alt=""><b>${esc(sp.name)}</b></div>`;
    el.title = `Sponsor: ${sp.name}`;
    bindCard(marker(el, BLIMP_SPOTS[i][0], BLIMP_SPOTS[i][1], "center").getElement(), { kind: "sponsor", ...sp });
  });
}

function sponsorsFrom(events) {
  const skip = /^(personal|aicollective\.com|hacklist.*|.*community|.*events? calendar|.*events)$/i;
  const isVenue = h => VENUES.some(v => v.host && v.host.test(h));
  // Only organizations ride blimps: names that run a calendar of their own, not individual hosts.
  const org = h => h && (/\bbond ai\b/i.test(h) ? "Bond AI" : h.trim());
  const orgs = new Set(events.map(e => org(e.source)));
  const c = {};
  events.forEach(e => new Set([...(e.hosts || []), e.source]).forEach(h => { h = org(h); if (h && !skip.test(h) && !isVenue(h)) (c[h] ||= []).push(e); }));
  return Object.entries(c).filter(([n, es]) => es.length > 1 && orgs.has(n)).sort((a, b) => b[1].length - a[1].length).slice(0, BLIMP_SPOTS.length).map(([name, events]) => ({ name, events }));
}

// ── Card ──
function openCard(p, el) {
  document.querySelectorAll('.pin[aria-expanded="true"]').forEach(x => x.setAttribute("aria-expanded", "false"));
  if (el.classList.contains("pin")) el.setAttribute("aria-expanded", "true");
  const kinds = { venue: "VENUE", landmark: "LANDMARK", city: "CITY", sponsor: "SPONSOR", spot: p.pub ? "EVENT VENUE" : "NEIGHBORHOOD" };
  $("#ckind").textContent = kinds[p.kind];
  const evs = p.events || [];
  const art = p.art || (p.kind === "landmark" ? `sprites/${p.id}.webp` : null);
  $("#cbody").innerHTML = `${art ? `<img class="art" src="${art}" alt="">` : ""}<h2>${esc(p.name)}</h2>
    ${p.address ? `<p class="where">${esc(p.address)}</p>` : ""}
    ${p.where ? `<p class="where">${esc(p.where)}</p>` : ""}
    ${p.note ? `<p>${esc(p.note)}</p>` : ""}
    ${p.tags ? `<div class="tags">${p.tags.map(t => `<span>${esc(t)}</span>`).join("")}</div>` : ""}
    ${(p.urls || (p.url ? [p.url] : [])).map(u => `<p><a class="btn" href="${esc(u)}" target="_blank" rel="noopener">VISIT ${esc(new URL(u).hostname.toUpperCase())} →</a></p>`).join("")}
    ${p.fly ? `<p><button class="btn blue" data-fly-card="${p.fly}">ZOOM INTO THE CITY →</button></p>` : ""}
    ${p.kind === "sponsor" ? `<p>Hosting or sponsoring ${evs.length} events on the calendar.</p>` : ""}
    ${evs.length ? `<div class="evs">${evs.slice(0, 12).map(e => evHtml(e, true)).join("")}</div>` : p.kind === "venue" ? `<p style="color:var(--mute)">Nothing on the calendar here yet.</p>` : ""}`;
  $("#card").hidden = false;
  $("#cbody [data-fly-card]")?.addEventListener("click", e => fly(e.currentTarget.dataset.flyCard));
}
$("#cclose").onclick = () => { $("#card").hidden = true; document.querySelectorAll(".pin").forEach(x => x.setAttribute("aria-expanded", "false")); };

// ── Panel & controls ──
function renderWeek() {
  const today = isoLocal(new Date()), end = isoLocal(new Date(Date.now() + 6 * 864e5));
  let up = EVENTS.filter(e => e.date >= today && e.date <= end);
  if (!up.length) up = EVENTS.slice(0, 30);
  const days = {}; up.forEach(e => (days[e.date] ||= []).push(e));
  $("#week").innerHTML = Object.entries(days).map(([d, es]) => `<div class="day"><h3>${d === today ? "TODAY" : parseDay(d).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }).toUpperCase()} · ${es.length}</h3>${es.map(e => evHtml(e)).join("")}</div>`).join("");
}
function fly(v) { map.fitBounds(VIEWS[v], { padding: 40, pitch: map.getPitch(), duration: 1800 }); history.replaceState(null, "", "#" + v); }
document.querySelectorAll("[data-fly]").forEach(b => b.onclick = () => fly(b.dataset.fly));
$("#tilt").onclick = () => { const on = map.getPitch() < 10; map.easeTo({ pitch: on ? 45 : 0, duration: 800 }); $("#tilt").setAttribute("aria-pressed", on); };
$("#fold").onclick = () => { const b = $("#title .body"); b.hidden = !b.hidden; $("#fold").textContent = b.hidden ? "▸" : "▾"; $("#fold").setAttribute("aria-expanded", !b.hidden); };
document.querySelectorAll("[data-layer]").forEach(b => b.onclick = () => {
  const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", on);
  document.body.classList.toggle("hide-" + b.dataset.layer, !on); declutterSoon();
});

// ── Boot ──
fetch("events.json").then(r => r.json()).catch(() => []).then(rows => {
  EVENTS = rows.map(e => ({ ...e, k: kindOf(e) })).sort((a, b) => a.date.localeCompare(b.date) || mins(a.time) - mins(b.time));
  renderWeek();
  const start = () => { placeAll(); onZoom(); if (location.hash !== "#bay") map.jumpTo({ center: [-122.418, 37.776], zoom: Math.max(12.2, map.getZoom() + 0.7) }); /* a little closer than the whole city, so landmarks and venues show */ declutterSoon(); };
  start(); // markers don't need tiles, so don't wait for them
});
</script>

</html>
